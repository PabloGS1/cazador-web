name: El Cazador

on:
  schedule:
    - cron: "25 6 * * *"        # 06:25 UTC ≈ 08:25 en NL/CEST
  workflow_dispatch:            # botón "Run workflow" en GitHub

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Scrape
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scraper.py --delay 0.4

      - name: Match
        run: python matcher.py --min 40

      - name: Notificar por email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python notify.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar wrangler
        run: npm ci
        working-directory: worker

      - name: Generar seed y actualizar D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sin CLOUDFLARE_API_TOKEN: se omite la subida a D1"
            exit 0
          fi
          python make_seed_chunks.py
          npx wrangler d1 execute cazador --remote --command "DELETE FROM jobs;"
          for f in seed/chunk-*.sql; do
            echo ">> ${f}"
            npx wrangler d1 execute cazador --remote --file="${f}"
          done
          echo "D1 actualizado OK"
        working-directory: worker

      - name: Commit de datos
        run: |
          git config user.name "el-cazador[bot]"
          git config user.email "actions@github.com"
          git add web/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "hunt: actualiza ofertas $(date -u +%F)"
            git push
          else
            echo "sin cambios en jobs.json"
          fi
