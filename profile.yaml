# ---------------------------------------------------------------------------
# 8. SENIORITY
# ---------------------------------------------------------------------------
seniority:
  # seniority_fit: 1.0 mid/senior IC, 0.3 director+, 0.0 junior
  bonus: ["senior", "lead", "manager", "principal", "head"]
  penalty: ["intern", "internship", "graduate", "working student", "junior",
            "trainee", "practice", "director", "vp", "vice president"]
  director_penalty: 0.3  # score × 0.3 si es director/VP
  junior_penalty: 0.0    # score × 0.0 si es junior/intern

