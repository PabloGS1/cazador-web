# ---------------------------------------------------------------------------
# 4. HARD REJECT — descualificadores duros
# ---------------------------------------------------------------------------
hard_reject:
  # Idiomas que si se piden → descarte (excepto los que hablo)
  languages_forbidden:
    - "dutch"
    - "flemish"
    - "danish"
    - "norwegian"
    - "swedish"
    - "finnish"
    - "italian"
    - "portuguese"
    - "mandarin"
    - "cantonese"
    - "japanese"
    - "korean"
    - "thai"
    - "indonesian"
    - "malay"
    - "vietnamese"
    - "turkish"
    - "polish"
    - "czech"
    - "hungarian"
    - "greek"
    - "russian"
    - "hindi"
    - "tamil"
  # Idiomas que hablo (para check de lang_req)
  languages_spoken:
    - "english"
    - "spanish"
    - "french"
  # Experiencia máxima aceptable (años)
  max_years_experience: 6
  # Ubicaciones que NO acepto (restricción explícita en la oferta)
  restricted_locations:
    - "us only"
    - "united states only"
    - "canada only"
    - "latam only"
    - "india only"
    - "usa only"
  # Certificaciones que si se piden como mandatory → descarte
  forbidden_certs:
    - "aws solutions architect professional"
    - "aws sa pro"
    - "cka"
    - "cissp"
    - "compTIA"
  # Patrones que indican hands-on production ownership
  production_patterns:
    - "on-call"
    - "on call"
    - "sla"
    - "incident response"
    - "code review"
    - "pull request"
    - "ci/cd"
    - "kubernetes"
    - "terraform"
    - "ansible"
  # Red establecida en mercado nacional específico (si se menciona)
  established_network_patterns:
    - "well-connected in"
    - "established network in"
    - "strong network in"
    - "deep connections in"
    - "existing relationships in"

