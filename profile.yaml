  keywords:
    - ["ai sales", "data sales", "ai infrastructure", "data platform", "genai", "generative ai",
       "rag", "ai agents", "agentic", "llm", "machine learning", "ai factory", "ai factories"]
    - ["databricks", "snowflake", "denodo", "nvidia", "dell", "hpe", "fujitsu", "microsoft",
       "ibm", "data lake", "data lakehouse", "data space", "data virtualisation",
       "data virtualization", "data migration"]
    - ["data center", "datacenter", "data centre", "gpu compute", "hpc", "compute",
       "ai infrastructure", "ai operations", "semiconductor", "energy", "power",
       "colocation", "hyperscale"]
    - ["cloud", "saas", "paas", "iaas", "aws", "azure", "gcp", "kubernetes"]
    - ["iot", "smart city", "smart cities", "connectivity", "telecom"]
    - ["public sector", "government", "public administration", "procurement",
       "public procurement", "tender", "tenders", "citizen", "eu ai act",
       "data governance", "data lineage", "ai governance"]
    - ["european commission", "european union", "eu institutions", "trade policy",
       "economics", "economy", "single market", "commercial diplomacy"]
    - ["openai", "anthropic", "gemini", "gpt", "copilot", "chatbot",
       "virtual assistant", "automation", "rpa"]

