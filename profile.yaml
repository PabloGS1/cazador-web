# =============================================================================
# PERFIL DE SCORING — Pablo García-Salguero
# =============================================================================
# Fórmula: score = 100 × role_weight × geo_weight × (0.5 + 0.5 × domain) × seniority_fit
# El dominio MODULA, no decide. El rol FILTRA primero.

# ---------------------------------------------------------------------------
# 1. IDENTITY — quién soy (para matching semántico)
# ---------------------------------------------------------------------------
identity: |
  Commercial technology professional with five years of full-cycle enterprise
  B2B sales in AI, data platforms and IT infrastructure. I sell: I own quota,
  pipeline, negotiation and close. I am not an engineer and I do not build or
  operate production systems for customers.

  My work sits between sales, pre-sales and product: I run technical discovery
  with IT and engineering stakeholders, define reference architectures together
  with product and engineering teams, design pilots and proofs of concept, build
  the business case and TCO model, and close the contract. I am technically
  literate — I write Python, I ship my own software, I hold NVIDIA AI
  Infrastructure certification — but my accountability is revenue, not delivery.

  Domains I know commercially: data platforms and lakehouses, data lakes and data
  spaces, data virtualisation and migration, GenAI and agentic systems, RAG,
  data and AI governance, EU AI Act compliance, GPU compute and AI
  infrastructure, data centre engineering services, IoT hardware and SaaS.

  Vendor ecosystem: Databricks, Snowflake, Denodo, Microsoft, IBM, NVIDIA,
  Dell, HPE, Fujitsu.

  Buyers: CTOs, CIOs, IT directors, engineering leads, heads of data,
  public-sector procurement bodies. Markets: Spain, Latin America,
  Saudi Arabia. Public sector is a genuine specialism.

  Languages: Spanish native, English C1, French B1, German A2, basic Arabic.
  EU citizen. No visa needed in the EU.

