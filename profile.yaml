# PERFIL DE MATCH — derivado del CV de Pablo García-Salguero (LinkedIn + CV)
# Usado por matcher.py para puntuar cada oferta (0-100, tope 90).
# Perfil: AI & Big Data Sales (sector público), MBA, CFA L1. Exp. IoT/SaaS/Data Centers.
# Roles objetivo: Sales/Solutions Engineer, Presales/Consultor técnico, BDM, KAM.
# Regla del usuario: nada "extremadamente demandante" (5+ años / muchas certs) salvo BD.

target_roles:
  # Familia -> palabras que disparan un match fuerte en el título
  "sales_engineering":
    label: "Sales / Solutions Engineer"
    weight: 36
    keywords: ["sales engineer", "solutions engineer", "solution engineer", "presales",
               "pre-sales", "pre sales", "technical sales", "solutions consultant",
               "value engineer", "solutions architect", "technical account", "field engineer",
               "sales consultant", "technical consultant", "pre-sales engineer",
               "solutions advisor", "presales consultant", "sales architect"]
  "ai_data_sales":
    label: "IA / Data Sales"
    weight: 36
    keywords: ["ai sales", "data sales", "business development", "bdm", "b2b sales",
               "account executive", "account manager", "key account", "hunter",
               "sales manager", "sales executive", "seller",
               "sales area manager", "account director", "area sales manager"]
  "key_account":
    label: "Key Account Manager"
    weight: 34
    keywords: ["key account manager", "kam", "key account", "strategic account",
               "global account", "major accounts", "named account"]
  "product_engineer":
    label: "Product / Pre-sales"
    weight: 32
    keywords: ["product engineer", "product owner", "product manager", "technical product",
               "product specialist", "solutions architect", "pre-sales consultant",
               "presales consultant", "sales consultant"]
  "bdm":
    label: "Business Development"
    weight: 34
    keywords: ["business development manager", "business development", "bdm",
               "partnerships manager", "alliances", "channel manager", "partner manager",
               "go-to-market", "gtm manager", "new business"]

